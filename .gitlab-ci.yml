# CI: build de imagen y push a GitLab Container Registry
# Se ejecuta al crear un tag (ej: git tag v1.0.0 && git push origin v1.0.0)
#
# Build: solo VITE_API_URL (vacío). Firebase y demás secretos van en el servidor / contenedor.

stages:
  - build

build:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --cache=true
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Dockerfile
      --build-arg VITE_API_URL=${VITE_API_URL:-}
      --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
      --destination $CI_REGISTRY_IMAGE:latest
  only:
    - tags
