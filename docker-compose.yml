# Imagen desde GitLab Container Registry (build en CI al taguear).
# En el servidor: .env con GITLAB_REGISTRY_IMAGE + secretos del API y `docker compose pull && docker compose up -d`
services:
  ordenes-ineco:
    image: ${GITLAB_REGISTRY_IMAGE}
    pull_policy: always
    ports:
      - "${APP_PORT:-8081}:80"
    environment:
      PORT: 3000
      FIREBASE_API_KEY: ${FIREBASE_API_KEY}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
      FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID}
      FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
      UPLOADS_DIR: /app/api/uploads/firmas
      MAX_FIRMA_BYTES: ${MAX_FIRMA_BYTES:-5242880}
    volumes:
      - ./uploads:/app/api/uploads
