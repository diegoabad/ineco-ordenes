server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/firmas/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # No cachear 404 largos: si el archivo se recupera al reiniciar, el browser debe pedirlo de nuevo.
        add_header Cache-Control "public, max-age=300, must-revalidate";
        access_log off;
    }

    location /uploads/presupuestos/ {
        alias /app/api/uploads/presupuestos/;
        add_header Cache-Control "no-store";
        access_log off;
    }

    location /uploads/envios/ {
        alias /app/api/uploads/envios/;
        add_header Cache-Control "no-store";
        access_log off;
    }

    location /uploads/pami/ {
        alias /app/api/uploads/pami/;
        add_header Cache-Control "no-store";
        access_log off;
    }

    location /uploads/pedidos/ {
        alias /app/api/uploads/pedidos/;
        add_header Cache-Control "no-store";
        access_log off;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
